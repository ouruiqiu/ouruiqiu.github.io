        <iframe id="gt4-frame" src="/games/turtle-rabbit-s4.html" title="龟兔赛跑（第四季）· 同时博弈课堂互动系统" style="width:100%;border:0;min-height:900px;display:block" loading="lazy"></iframe>

<script>
(function(){
  var f = document.getElementById('gt4-frame');
  if(!f) return;
  var rafId = 0;
  function fit(){
    try{
      var d = f.contentDocument;
      if(!d || !d.body) return;
      var b = d.body;
      var h = Math.ceil(Math.max(b.scrollHeight, b.getBoundingClientRect().height));
      if(h > 0){
        if(Math.abs(parseInt(f.style.height || 0, 10) - h) > 1) f.style.height = h + 'px';
        if(f.style.minHeight) f.style.minHeight = '0'; // 高度已由内容决定，解除占位钳制
      }
    }catch(e){}
  }
  function pulse(){ // 覆盖切换页面等过渡动画期间的中间高度
    var end = Date.now() + 600;
    cancelAnimationFrame(rafId);
    (function step(){ fit(); if(Date.now() < end) rafId = requestAnimationFrame(step); })();
  }
  function attach(){
    fit(); pulse();
    try{
      var w = f.contentWindow, d = f.contentDocument;
      if(!w || !d || !d.body) return;
      if(w.ResizeObserver && !f._ro){ // 正文高度变化（切页、回合推进、结果展开）都会触发
        f._ro = new w.ResizeObserver(fit);
        f._ro.observe(d.body);
      }
      if(w.addEventListener && !f._bound){
        f._bound = true;
        w.addEventListener('orientationchange', fit);
        d.addEventListener('transitionend', fit);
        d.addEventListener('animationend', fit);
        d.addEventListener('click', pulse, true);
      }
    }catch(e){}
  }
  f.addEventListener('load', function(){
    f._ro = null; f._bound = false;
    attach(); setTimeout(attach, 300); setTimeout(attach, 1000);
  });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  if(f.contentDocument && f.contentDocument.readyState === 'complete') attach();
})();
</script>
